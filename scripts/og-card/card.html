<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rsquared Academy — share card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap"
    />
    <style>
      :root {
        --ink: #0f172a;
        --muted: #475569;
        --brand: #2563eb;
        --surface-tint: #eaf1ff;
        --line: #e2e8f0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        overflow: hidden;
        background: #ffffff;
        color: var(--ink);
        font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 1200px;
        height: 630px;
        padding: 68px 80px 60px;
        background:
          radial-gradient(
            860px 520px at 100% 0%,
            var(--surface-tint) 0%,
            rgba(234, 241, 255, 0) 62%
          ),
          #ffffff;
      }

      .card::after {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background: var(--brand);
        content: "";
      }

      .logo {
        display: flex;
        align-items: center;
      }

      .logo img {
        display: block;
        width: 76px;
        height: 76px;
      }

      .copy {
        margin-top: auto;
        margin-bottom: auto;
        padding-top: 36px;
      }

      h1 {
        font-family: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      p {
        max-width: 760px;
        margin-top: 26px;
        color: var(--muted);
        font-size: 33px;
        font-weight: 400;
        line-height: 1.32;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-top: 26px;
        border-top: 1px solid var(--line);
      }

      .domain {
        color: var(--brand);
        font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img
          src="../../public/images/rsquared-logo.png"
          alt="Rsquared Academy logo"
          width="76"
          height="76"
        />
      </div>

      <div class="copy">
        <h1>Rsquared Academy</h1>
        <p>Free interactive R courses with instant feedback. Nothing to install.</p>
      </div>

      <div class="footer">
        <span class="domain">rsquaredacademy.com</span>
      </div>
    </div>
  </body>
</html>
