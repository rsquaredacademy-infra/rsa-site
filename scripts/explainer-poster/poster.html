<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>How learning works here — video poster</title>
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { width: 1920px; height: 1080px; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-body); }
      main { position: relative; width: 100%; height: 100%; padding: 88px 96px; background: linear-gradient(115deg, var(--surface), var(--surface-tint)); }
      main::before { content: ''; position: absolute; inset: 0 0 auto; height: 12px; background: var(--brand); }
      .wordmark { display: flex; align-items: center; gap: 22px; font: 700 38px var(--font-display); }
      .wordmark img { width: 64px; height: 64px; }
      h1 { width: 850px; margin-top: 68px; font: 800 112px/1.07 var(--font-display); letter-spacing: -0.035em; }
      h1 span { color: var(--brand); }
      p { width: 810px; margin-top: 40px; color: var(--ink-muted); font-size: 46px; line-height: 1.35; }
      .lesson { position: absolute; top: 180px; right: 88px; width: 820px; border: 2px solid var(--line); border-radius: 28px; box-shadow: var(--shadow-card); }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark"><img src="../../public/images/rsquared-logo.png" alt="" />Rsquared Academy</div>
      <h1>How learning<br /><span>works here</span></h1>
      <p>1 min · Read → Fill the gaps →<br />Fix the code → Write it yourself</p>
      <img class="lesson" alt="A frame from the real lesson video" />
    </main>
  </body>
</html>
